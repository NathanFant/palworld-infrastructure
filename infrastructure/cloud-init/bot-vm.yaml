#cloud-config
# User-data for the AMD E2.1.Micro bot VM. Lighter-weight than game-vm.yaml — this
# host only runs the Discord bot container; it has no RCON exposure and isn't the
# target of restricted SSH (it's the one *initiating* SSH to the game VM, using the
# keypair described in README.md).

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades

users:
  - default
  - name: bot
    gecos: "Runs the Discord bot container"
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

runcmd:
  # --- Docker Engine + Compose plugin, same official repo as the game VM ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  - dpkg-reconfigure -f noninteractive unattended-upgrades

  # --- Bot deploy target + persistent state directory ---
  - mkdir -p /opt/palworld-bot /opt/palworld-bot/data
  - chown bot:docker /opt/palworld-bot /opt/palworld-bot/data
