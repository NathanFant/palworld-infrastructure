#cloud-config
# User-data for the Ampere A1 game VM -- the only VM in this project (see
# docs/decisions/005-consolidate-bot-onto-game-vm.md for why the Discord bot runs
# here too, as a second Docker container, rather than on its own host). Rendered via
# Terraform's templatefile() in the Terraform game-VM ticket, which supplies
# ${palworld_bot_ssh_public_key} — the public half of a dedicated keypair generated
# for the bot's forced-command SSH access (see README.md in this directory for the
# generation/injection flow). This file only prepares the environment (Docker, mount,
# control users, hardening); the actual Palworld and Discord bot docker-compose.yml
# files are deployed separately by scripts/deploy.sh / scripts/deploy-bot.sh.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - fail2ban
  - unattended-upgrades
  # build-essential + git: building mcrcon from source (backup.sh's RCON client --
  # single C file, no other deps, more robust than pinning a release binary URL/arch).
  - build-essential
  - git

users:
  - default
  - name: palworld-bot
    gecos: "Restricted control account for the Discord bot's SSH access"
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    # command= restricts this key to ONLY run palworld-ctl, with whatever subcommand
    # the bot sent, no interactive shell — see README.md for the full rationale. Kept
    # as a single-purpose account deliberately separate from the "bot" user below,
    # even though both now live on the same VM -- this one's only capability is the
    # forced-command SSH shim, nothing else.
    ssh_authorized_keys:
      - 'command="/usr/local/bin/palworld-ctl $SSH_ORIGINAL_COMMAND",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty ${palworld_bot_ssh_public_key}'
  - name: bot
    gecos: "Runs the Discord bot container"
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /usr/local/bin/palworld-ctl
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Forced-command target for the bot's SSH key — see cloud-init/README.md.
      # Only ever invoked as: ssh palworld-bot@game-vm {start|stop|status}
      # $SSH_ORIGINAL_COMMAND is untrusted input from the SSH client; treat it as such.
      set -euo pipefail

      COMPOSE_FILE="/opt/palworld/docker-compose.yml"
      COMPOSE="docker compose -f $${COMPOSE_FILE}"

      case "$${1:-}" in
        start)
          exec $${COMPOSE} up -d
          ;;
        stop)
          exec $${COMPOSE} down
          ;;
        status)
          exec $${COMPOSE} ps --format json
          ;;
        *)
          echo "usage: palworld-ctl {start|stop|status}" >&2
          exit 64
          ;;
      esac

  - path: /etc/systemd/system/palworld-backup@.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Palworld backup (%i)
      After=docker.service

      [Service]
      Type=oneshot
      User=palworld-bot
      ExecStart=/opt/palworld/backup.sh %i

  - path: /etc/systemd/system/palworld-backup-hourly.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Hourly Palworld backup

      [Timer]
      Unit=palworld-backup@hourly.service
      OnCalendar=hourly
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/palworld-backup-daily.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Daily Palworld backup

      [Timer]
      Unit=palworld-backup@daily.service
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/palworld-backup-weekly.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Weekly Palworld backup

      [Timer]
      Unit=palworld-backup@weekly.service
      OnCalendar=weekly
      Persistent=true

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/palworld-backup-monthly.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Monthly Palworld backup

      [Timer]
      Unit=palworld-backup@monthly.service
      OnCalendar=monthly
      Persistent=true

      [Install]
      WantedBy=timers.target

runcmd:
  # --- Docker Engine + Compose plugin, from Docker's official apt repo ---
  # (Ubuntu's own docker.io package lags behind the "docker compose" plugin support
  # this project's control scripts assume.)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # --- fail2ban / unattended-upgrades: install already covers defaults; just enable ---
  - systemctl enable --now fail2ban
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  # --- World-save Block Volume: format once (if unformatted) and mount persistently ---
  # /dev/oracleoci/oraclevdb is OCI's documented stable path for the second
  # paravirtualized-attached volume (boot volume is oraclevda). `nofail` in fstab so a
  # boot doesn't hang if the volume isn't attached yet.
  - mkdir -p /mnt/palworld-data
  - >
    blkid /dev/oracleoci/oraclevdb || mkfs.ext4 /dev/oracleoci/oraclevdb
  - >
    grep -q oraclevdb /etc/fstab ||
    echo "/dev/oracleoci/oraclevdb /mnt/palworld-data ext4 defaults,nofail 0 2" >> /etc/fstab
  - mount -a

  # --- Palworld deploy target directory (compose file itself deployed separately) ---
  - mkdir -p /opt/palworld
  - chown palworld-bot:docker /opt/palworld /mnt/palworld-data

  # --- Discord bot deploy target + persistent state directory ---
  - mkdir -p /opt/palworld-bot /opt/palworld-bot/data
  - chown bot:docker /opt/palworld-bot /opt/palworld-bot/data

  # --- mcrcon: RCON client backup.sh uses to trigger a Save before snapshotting ---
  # (docker/compose.yml already publishes RCON to the host, so this connects to
  # localhost:<rcon_port> -- no container access needed.)
  - >
    test -x /usr/local/bin/mcrcon ||
    (git clone --depth 1 https://github.com/Tiiffi/mcrcon.git /tmp/mcrcon &&
    make -C /tmp/mcrcon &&
    install -m 0755 /tmp/mcrcon/mcrcon /usr/local/bin/mcrcon &&
    rm -rf /tmp/mcrcon)

  # --- OCI CLI: backup.sh uploads to Object Storage via instance-principal auth --
  # (infrastructure/terraform/backup-iam.tf), no static credential file involved.
  - >
    test -x /usr/local/bin/oci ||
    bash -c "$(curl -Ls https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)"
    -- --accept-all-defaults

  # --- Backup timers ---
  # backup.sh/restore.sh themselves are deployed separately by scripts/deploy.sh, not
  # by cloud-init -- these timers will fail (and self-heal once deployed) if a timer
  # fires before the first deploy.sh run, which is expected: there's nothing to back
  # up before a world exists anyway.
  - systemctl daemon-reload
  - >
    systemctl enable --now
    palworld-backup-hourly.timer
    palworld-backup-daily.timer
    palworld-backup-weekly.timer
    palworld-backup-monthly.timer
