name: Discord Bot CI

on:
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/bot-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4

      - name: Check for bot project
        id: has-package
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.has-package.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install dependencies
        if: steps.has-package.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.has-package.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.has-package.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.has-package.outputs.present == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.has-package.outputs.present == 'true'
        run: npm run build --if-present

      - name: No bot project yet
        if: steps.has-package.outputs.present == 'false'
        run: echo "discord-bot/package.json not present yet — nothing to do (Phase 4 bot-scaffold ticket adds it)."
