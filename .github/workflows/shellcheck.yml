name: Shellcheck

on:
  pull_request:
    paths:
      - "scripts/**.sh"
      - "backups/**.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runners ship shellcheck preinstalled — no third-party action needed,
      # and this scopes the scan exactly to scripts/** and backups/** as intended.
      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          files=(scripts/**/*.sh backups/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found under scripts/ or backups/."
            exit 0
          fi
          shellcheck "${files[@]}"
