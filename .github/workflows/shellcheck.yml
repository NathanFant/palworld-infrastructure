name: Shellcheck

on:
  pull_request:
    paths:
      - "scripts/**.sh"
      - "backups/**.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find shell scripts
        id: find
        run: |
          files=$(find scripts backups -type f -name "*.sh" 2>/dev/null || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run shellcheck
        if: steps.find.outputs.files != ''
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: "node_modules"
