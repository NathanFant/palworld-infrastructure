## Palworld dedicated server, deployed to /opt/palworld/docker-compose.yml on the game
## VM (the path infrastructure/cloud-init/game-vm.yaml's palworld-ctl script hardcodes).
## Reads its environment from a sibling .env file at deploy time (scripts/deploy.sh
## renders one from the repo root's .env.local — see .env.example for the full list
## of PALWORLD_*/RCON_* variables this references; not duplicated here).
##
## Image: thijsvanloef/palworld-server-docker — actively maintained, RCON support,
## env-driven config (see CLAUDE.md's architecture decisions).
##
## Port variables have :-8211/:-25575 fallbacks matching .env.example's own defaults
## — purely so `docker compose config` can validate structurally without a real .env
## present (e.g. in CI). A real deployment's .env always overrides these.
services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"

      SERVER_NAME: ${PALWORLD_SERVER_NAME}
      SERVER_DESCRIPTION: ${PALWORLD_SERVER_DESCRIPTION}
      ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD}
      SERVER_PASSWORD: ${PALWORLD_SERVER_PASSWORD}
      PORT: ${PALWORLD_PUBLIC_PORT:-8211}
      PLAYERS: ${PALWORLD_MAX_PLAYERS}

      # Listed in Palworld's in-game community server browser, gated by
      # SERVER_PASSWORD above (per thijsvanloef/palworld-server-docker's own
      # guidance: use COMMUNITY with a password set). Requires the query port
      # below to be open in addition to the main game port (see
      # infrastructure/terraform/network.tf's palworld_query_port rule).
      COMMUNITY: "true"
      QUERY_PORT: ${PALWORLD_QUERY_PORT:-27015}
      MULTITHREADING: "true"

      # RCON is how the bot controls the server (start/stop broadcast, countdown,
      # player queries) — required, not optional, for this project. This image has
      # no separate RCON credential: RCON auth uses ADMIN_PASSWORD above, not
      # .env.example's RCON_PASSWORD field. The bot's own RCON client config must be
      # set to the same value as PALWORLD_ADMIN_PASSWORD, or its connection will
      # silently fail authentication if the two ever diverge.
      RCON_ENABLED: "true"
      RCON_PORT: ${RCON_PORT:-25575}

      # This image ships its own local backup/cron feature — explicitly disabled.
      # Phase 3's backup.sh owns backups (RCON save + upload to Object Storage with
      # a real retention policy); leaving this on would accumulate a second,
      # unmanaged set of local backups on the same disk indefinitely.
      BACKUP_ENABLED: "false"

      UPDATE_ON_BOOT: "true"
    ports:
      - "${PALWORLD_PUBLIC_PORT:-8211}:${PALWORLD_PUBLIC_PORT:-8211}/udp"
      # Community server list query port -- only needed while COMMUNITY=true above.
      - "${PALWORLD_QUERY_PORT:-27015}:${PALWORLD_QUERY_PORT:-27015}/udp"
      # RCON is bound to loopback only (127.0.0.1), not 0.0.0.0 -- the Discord bot
      # runs as a second container on this same VM (network_mode: host, see
      # discord-bot/docker-compose.yml) and reaches this port over the host's own
      # loopback interface, which never touches the VCN's network fabric at all.
      # Nothing outside this one host has ever needed RCON since the bot was
      # consolidated onto the game VM (docs/decisions/005-consolidate-bot-onto-game-vm.md).
      - "127.0.0.1:${RCON_PORT:-25575}:${RCON_PORT:-25575}/tcp"
    volumes:
      - /mnt/palworld-data:/palworld
